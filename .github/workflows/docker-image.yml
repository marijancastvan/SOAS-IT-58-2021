name: Build and Push Docker Images

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repozitorijuma
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Logovanje na Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # 3️⃣ Build ServiceLibrary (OBAVEZNO)
      - name: Build and install ServiceLibrary
        working-directory: ./ServiceLibrary
        run: mvn clean install -DskipTests

      # 3.2️⃣ Build Util (OBAVEZNO)
      - name: Build and install Util
        working-directory: ./Util
        run: mvn clean install -DskipTests


      # 4️⃣ Maven build za sve mikroservise
      - name: Build UsersService JAR
        working-directory: ./UsersService
        run: mvn clean package -DskipTests

      - name: Build Naming Server JAR
        working-directory: ./naming-server
        run: mvn clean package -DskipTests

      - name: Install Currency Exchange
        working-directory: ./currency-exchange
        run: mvn clean install -DskipTests 

      - name: Build Currency Exchange JAR
        working-directory: ./currency-exchange
        run: mvn clean package -DskipTests

      - name: Build Currency Conversion JAR
        working-directory: ./currency-conversion
        run: mvn clean package -DskipTests

      - name: Build Bank Account JAR
        working-directory: ./BankAccount
        run: mvn clean package -DskipTests

      - name: Build Crypto Wallet JAR
        working-directory: ./CryptoWallet
        run: mvn clean package -DskipTests

      - name: Build Crypto Exchange JAR
        working-directory: ./CryptoExchange
        run: mvn clean package -DskipTests

      - name: Build Crypto Conversion JAR
        working-directory: ./CryptoConversion
        run: mvn clean package -DskipTests

      - name: Build Trade Service JAR
        working-directory: ./TradeService
        run: mvn clean package -DskipTests

      - name: Build API Gateway JAR
        working-directory: ./api-gateway
        run: mvn clean package -DskipTests

      # 5️⃣ Build i push Docker slike
      - name: Build and push UsersService
        uses: docker/build-push-action@v5
        with:
          context: ./UsersService
          file: ./UsersService/Dockerfile
          push: true
          tags: marijancastvan/users-service:latest

      - name: Build and push Naming Server
        uses: docker/build-push-action@v5
        with:
          context: ./naming-server
          file: ./naming-server/Dockerfile
          push: true
          tags: marijancastvan/naming-server:latest

      - name: Build and push Currency Exchange
        uses: docker/build-push-action@v5
        with:
          context: ./currency-exchange
          file: ./currency-exchange/Dockerfile
          push: true
          tags: marijancastvan/currency-exchange:latest

      - name: Build and push Currency Conversion
        uses: docker/build-push-action@v5
        with:
          context: ./currency-conversion
          file: ./currency-conversion/Dockerfile
          push: true
          tags: marijancastvan/currency-conversion:latest

      - name: Build and push Bank Account
        uses: docker/build-push-action@v5
        with:
          context: ./BankAccount
          file: ./BankAccount/Dockerfile
          push: true
          tags: marijancastvan/bank-account:latest

      - name: Build and push Crypto Wallet
        uses: docker/build-push-action@v5
        with:
          context: ./CryptoWallet
          file: ./CryptoWallet/Dockerfile
          push: true
          tags: marijancastvan/crypto-wallet:latest

      - name: Build and push Crypto Exchange
        uses: docker/build-push-action@v5
        with:
          context: ./CryptoExchange
          file: ./CryptoExchange/Dockerfile
          push: true
          tags: marijancastvan/crypto-exchange:latest

      - name: Build and push Crypto Conversion
        uses: docker/build-push-action@v5
        with:
          context: ./CryptoConversion
          file: ./CryptoConversion/Dockerfile
          push: true
          tags: marijancastvan/crypto-conversion:latest

      - name: Build and push Trade Service
        uses: docker/build-push-action@v5
        with:
          context: ./TradeService
          file: ./TradeService/Dockerfile
          push: true
          tags: marijancastvan/trade-service:latest

      - name: Build and push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          file: ./api-gateway/Dockerfile
          push: true
          tags: marijancastvan/api-gateway:latest
